version: "0.2"
language: en
dictionaries:
  - css
  - html
  - typescript
enableFiletypes:
  - ignore
  - properties
  - svelte
  - xml
files:
  - "**/.*"
  - "**/*.{css,js,json,jsonc,html,md,scss,svelte,svg,yaml,yml,xml}"
useGitignore: true
ignorePaths:
  # A worktree’s `.git` is a file rather than a directory, so the `**/.*` glob above picks it up
  - .git
  - pnpm-lock.yaml
  - data/**/*.json
  - src/**/*.test.js
words:
  - AZERTY
  - browserslist
  - Colemak
  - colour
  - colours
  - cooldown
  - CVEs
  - deproxified
  - esbuild
  - espree
  - GHSA
  - Ghsas
  - IndexedDB
  - jsdoc
  - nocheck
  - opsz
  - plusplus
  - pnpm
  - postcss
  - proxified
  - singleline
  - stylelint
  - sveltejs
  - Sveltia
  - unrs
  - Vite
  - Vitest
  - wght
