# cSpell:ignore deepmerge gcqx

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false

auditConfig:
  ignoreGhsas:
    # deepmerge: low severity, unpatched
    # https://github.com/advisories/GHSA-gcqx-w48m-w2h4
    - GHSA-gcqx-w48m-w2h4

engineStrict: true

minimumReleaseAge: 1440

overrides:
  # security fix
  browserslist@<=4.28.6: ^4.28.7
  # <0.7.0 has a security vulnerability, 2.0.0 causes issues with SvelteKit
  "cookie@<0.7.0": "^1.0.0"
